
name: Simple Calculator CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Calculator Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run calculator unit tests
        run: python -m unittest discover -v

  deploy:
    name: Deployment Demo
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Deployment
        run: echo "Tests passed. Ready for deployment!"
